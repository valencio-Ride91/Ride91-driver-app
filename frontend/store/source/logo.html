<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ride91 logo</title>
<!--
  Source of the Ride91 mark. This page draws every logo file with canvas and
  posts each PNG to serve.py, which writes it to ./out:
    icon.png, adaptive-icon.png, adaptive-icon-mono.png, splash-image.png,
    favicon.png            -> frontend/assets/images/
    play-icon-512.png, play-feature-1024x500.png -> frontend/store/
  To regenerate: copy the two fonts from frontend/assets/fonts next to this
  file (BricolageGrotesque-Variable.ttf, IBMPlexSans-Medium.ttf), run
  `python serve.py`, and open http://127.0.0.1:5311/logo.html.
-->
<style>
  @font-face { font-family: "Bricolage"; src: url("BricolageGrotesque-Variable.ttf"); font-weight: 200 800; font-stretch: 75% 100%; }
  @font-face { font-family: "Plex"; src: url("IBMPlexSans-Medium.ttf"); font-weight: 500; }
  body { margin: 16px; background: #dfe5df; font-family: system-ui; }
  canvas { background-image: repeating-conic-gradient(#ccc 0 25%, #eee 0 50%); background-size: 24px 24px; margin: 0 12px 12px 0; }
  #status { font: 14px system-ui; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="status">drawing…</div>
<div id="sheet"></div>
<script>
const INK = "#10231C", LIVE = "#0B7A4B", DOT = "#2FCB86", PAPER = "#EEF1EC", WHITE = "#FFFFFF", MUTED = "#9DB0A6";

// The mark: "91" set tight in Bricolage ExtraBold, with a round "live" dot at
// the top right — the same dot that sits beside the name in the ops panel and
// marks a driver as live. `box` is the square the mark is fitted into.
function drawMark(ctx, cx, cy, box, fg, dot) {
  const size = box * 0.74;
  ctx.save();
  ctx.font = `800 ${size}px "Bricolage"`;
  ctx.fontStretch = "normal";
  ctx.textBaseline = "alphabetic";
  ctx.letterSpacing = `${-size * 0.012}px`;
  const m = ctx.measureText("91");
  const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
  const h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const r = box * 0.078;
  // digits and dot are centred together as one shape
  const gap = r * 0.55;
  const totalW = w + gap + r * 2;
  const x0 = cx - totalW / 2 + m.actualBoundingBoxLeft;
  const y0 = cy + h / 2 - m.actualBoundingBoxDescent;
  ctx.fillStyle = fg;
  ctx.fillText("91", x0, y0);
  ctx.fillStyle = dot;
  ctx.beginPath();
  ctx.arc(cx - totalW / 2 + w + gap + r, y0 - m.actualBoundingBoxAscent + r, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function canvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}

const FILES = {};
function make(name, w, h, paint, showW) {
  const c = canvas(w, h);
  paint(c.getContext("2d"), w, h);
  c.style.width = (showW || 200) + "px";
  c.title = name;
  document.getElementById("sheet").appendChild(c);
  FILES[name] = c;
}

function wordmark(ctx, x, y, size, fg, dot) {
  ctx.save();
  ctx.font = `800 ${size}px "Bricolage"`;
  ctx.textBaseline = "alphabetic";
  ctx.letterSpacing = `${-size * 0.03}px`;
  ctx.fillStyle = fg;
  ctx.fillText("Ride91", x, y);
  const m = ctx.measureText("Ride91");
  const r = size * 0.085;
  ctx.fillStyle = dot;
  ctx.beginPath();
  ctx.arc(x + m.width + r * 1.5, y - size * 0.62, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  return m.width + r * 2.5;
}

async function main() {
  await Promise.all([document.fonts.load('800 100px "Bricolage"'), document.fonts.load('500 40px "Plex"')]);

  // Launcher icon (iOS / legacy Android / Play listing): full square, no transparency.
  const icon = (ctx, w) => { ctx.fillStyle = INK; ctx.fillRect(0, 0, w, w); drawMark(ctx, w / 2, w / 2, w * 0.86, WHITE, DOT); };
  make("icon.png", 1024, 1024, icon);
  make("play-icon-512.png", 512, 512, icon, 100);
  make("favicon.png", 196, 196, icon, 60);

  // Android adaptive icon: the launcher crops this to its own shape, so the
  // mark stays inside the middle ~58%. Background colour comes from app.json.
  make("adaptive-icon.png", 1024, 1024, (ctx, w) => drawMark(ctx, w / 2, w / 2, w * 0.56, WHITE, DOT));
  // Themed ("Material You") icons: one flat colour; Android tints it.
  make("adaptive-icon-mono.png", 1024, 1024, (ctx, w) => drawMark(ctx, w / 2, w / 2, w * 0.56, WHITE, WHITE));

  // Splash: Android 12+ shows this inside a circle on the background colour,
  // so it is the mark alone, kept inside the middle of the square.
  make("splash-image.png", 1024, 1024, (ctx, w) => drawMark(ctx, w / 2, w / 2, w * 0.60, WHITE, DOT));

  // Play Store feature graphic (1024 x 500).
  make("play-feature-1024x500.png", 1024, 500, (ctx, w, h) => {
    ctx.fillStyle = INK; ctx.fillRect(0, 0, w, h);
    ctx.save(); ctx.globalAlpha = 0.07; drawMark(ctx, w * 0.80, h * 0.52, h * 1.5, WHITE, WHITE); ctx.restore();
    wordmark(ctx, 72, 262, 150, WHITE, DOT);
    ctx.font = '500 40px "Plex"'; ctx.fillStyle = MUTED;
    ctx.fillText("Driver app", 78, 330);
  }, 420);

  // How it looks in use (preview only, not shipped).
  make("preview.png", 1500, 620, (ctx, w, h) => {
    ctx.fillStyle = "#C9D2CB"; ctx.fillRect(0, 0, w, h);
    ctx.font = '500 26px "Plex"'; ctx.fillStyle = INK;
    const label = (t, x, y) => ctx.fillText(t, x, y);
    const src = FILES["icon.png"], fg = FILES["adaptive-icon.png"];
    // rounded-square launcher
    const tile = (x, y, s, radius, draw) => { ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, s, s, radius); ctx.clip(); draw(); ctx.restore(); };
    tile(60, 90, 300, 66, () => ctx.drawImage(src, 60, 90, 300, 300));
    label("App icon", 60, 440);
    // circular adaptive mask: 108dp canvas, visible middle 72dp
    const circ = (x, y, s) => { ctx.save(); ctx.beginPath(); ctx.arc(x + s / 2, y + s / 2, s / 2, 0, Math.PI * 2); ctx.clip(); ctx.fillStyle = INK; ctx.fillRect(x, y, s, s); const full = s * 1.5; ctx.drawImage(fg, x - (full - s) / 2, y - (full - s) / 2, full, full); ctx.restore(); };
    circ(430, 90, 300); label("On a round launcher", 430, 440);
    [96, 64, 48].forEach((s, i) => { circ(800 + i * 120, 90 + (300 - s) / 2, s); });
    label("Small sizes", 800, 440);
    // splash phone
    ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(1190, 40, 260, 540, 34); ctx.fill();
    ctx.drawImage(FILES["splash-image.png"], 1190 + 30, 40 + 170, 200, 200);
    ctx.fillStyle = INK; label("Splash screen", 1190, 606);
  }, 900);

  let saved = 0;
  for (const [name, c] of Object.entries(FILES)) {
    const blob = await new Promise((r) => c.toBlob(r, "image/png"));
    const res = await fetch("/save?name=" + encodeURIComponent(name), { method: "POST", body: blob });
    if (res.ok) saved++;
  }
  document.getElementById("status").textContent = `saved ${saved}/${Object.keys(FILES).length}`;
  window.__done = saved;
}
main().catch((e) => { document.getElementById("status").textContent = "error: " + e.message; window.__err = String(e); });
</script>
</body>
</html>
