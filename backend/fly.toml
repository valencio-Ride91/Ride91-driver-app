# Fly.io config for the Ride91 backend. Deploy from this directory:
#   cd backend
#   fly launch --no-deploy --copy-config   # first time: creates the app
#   fly secrets set MONGO_URL="..." ADMIN_USERNAME="..." ADMIN_PASSWORD="..." \
#       RAZORPAY_KEY_ID="..." RAZORPAY_KEY_SECRET="..." RAZORPAY_WEBHOOK_SECRET="..." \
#       RAZORPAYX_ACCOUNT_NUMBER="..." RAZORPAYX_KEY_ID="..." RAZORPAYX_KEY_SECRET="..." \
#       RAZORPAYX_WEBHOOK_SECRET="..."
#   fly deploy
#
# Secrets live in Fly (fly secrets), never in this file or the repo.
# The database is external — MONGO_URL points at MongoDB Atlas.

app = "ride91-api"
primary_region = "bom"            # Mumbai

[build]
  dockerfile = "Dockerfile"       # context is this backend/ dir — matches the COPY paths

[env]
  PORT = "8000"
  DB_NAME = "ride91"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to zero when idle to stay within Fly's low-cost / free allowance.
  # First request after idle cold-starts in a few seconds; during operating
  # hours the app is rarely idle.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
