# Render blueprint for the Ride91 backend. Deploy: push to GitHub, then in
# Render "New → Blueprint" and point it at this repo. Secrets marked
# `sync: false` are entered once in the Render dashboard, never committed.
#
# This replaces Emergent's hosting. The database is external — create a
# MongoDB Atlas cluster and paste its connection string into MONGO_URL.
services:
  - type: web
    name: ride91-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: singapore            # closest to an India-based fleet
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGO_URL           # MongoDB Atlas SRV connection string
        sync: false
      - key: DB_NAME
        value: ride91
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAYX_ACCOUNT_NUMBER
        sync: false
      - key: RAZORPAYX_KEY_ID
        sync: false
      - key: RAZORPAYX_KEY_SECRET
        sync: false
      - key: RAZORPAYX_WEBHOOK_SECRET
        sync: false

  # Scheduled jobs — replaces Emergent's .emergent/cron. Each runs the
  # portable runner in backend/jobs.py. Add more as tasks are ported
  # (e.g. RazorpayX payout-status refresh, the daily Uber report import).
  - type: cron
    name: ride91-close-expired-qrs
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    schedule: "*/10 * * * *"          # every 10 min
    dockerCommand: python jobs.py close_expired_qrs
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: ride91

  - type: cron
    name: ride91-expire-stale-otps
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    schedule: "0 * * * *"             # hourly
    dockerCommand: python jobs.py expire_stale_otps
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: ride91
